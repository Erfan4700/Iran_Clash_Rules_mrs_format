rule-providers:
  # مسدودسازی‌ها (REJECT)
  iran_ads:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/YOUR_USER/YOUR_REPO/release/iran-ads.mrs"
    path: ./ruleset/iran-ads.mrs
    interval: 86400

  iran_security:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/YOUR_USER/YOUR_REPO/release/iran-security.mrs"
    path: ./ruleset/iran-security.mrs
    interval: 86400

  iran_gambling:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/YOUR_USER/YOUR_REPO/release/iran-gambling.mrs"
    path: ./ruleset/iran-gambling.mrs
    interval: 86400

  # ترافیک مستقیم داخلی (DIRECT)
  iran_domains:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/YOUR_USER/YOUR_REPO/release/iran-domains.mrs"
    path: ./ruleset/iran-domains.mrs
    interval: 86400

  iran_ips:
    type: http
    behavior: ipcidr
    format: mrs
    url: "https://raw.githubusercontent.com/YOUR_USER/YOUR_REPO/release/iran-ip.mrs"
    path: ./ruleset/iran-ip.mrs
    interval: 86400

rules:
  - RULE-SET,iran_ads,REJECT
  - RULE-SET,iran_security,REJECT
  - RULE-SET,iran_gambling,REJECT
  - RULE-SET,iran_domains,DIRECT
  - RULE-SET,iran_ips,DIRECT,no-resolve
  - MATCH,PROXY
