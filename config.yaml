rule-providers:
  iran_ads:
    type: http
    behavior: domain
    format: mrs
    url: "https://fastly.jsdelivr.net/gh/Erfan4700/iran-routing-rules@release/iran-ads.mrs"
    path: ./ruleset/iran-ads.mrs
    interval: 86400

  iran_media:
    type: http
    behavior: domain
    format: mrs
    url: "https://fastly.jsdelivr.net/gh/Erfan4700/iran-routing-rules@release/iran-media.mrs"
    path: ./ruleset/iran-media.mrs
    interval: 86400

  iran_banking:
    type: http
    behavior: domain
    format: mrs
    url: "https://fastly.jsdelivr.net/gh/Erfan4700/iran-routing-rules@release/iran-banking.mrs"
    path: ./ruleset/iran-banking.mrs
    interval: 86400

  iran_gaming:
    type: http
    behavior: domain
    format: mrs
    url: "https://fastly.jsdelivr.net/gh/Erfan4700/iran-routing-rules@release/iran-gaming.mrs"
    path: ./ruleset/iran-gaming.mrs
    interval: 86400

  iran_domains:
    type: http
    behavior: domain
    format: mrs
    url: "https://fastly.jsdelivr.net/gh/Erfan4700/iran-routing-rules@release/iran-domains.mrs"
    path: ./ruleset/iran-domains.mrs
    interval: 86400

rules:
  - RULE-SET,iran_ads,REJECT
  - RULE-SET,iran_banking,DIRECT
  - RULE-SET,iran_media,DIRECT
  - RULE-SET,iran_gaming,DIRECT
  - RULE-SET,iran_domains,DIRECT
  - MATCH,PROXY
