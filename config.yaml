rules:
  # --------------------------------------------------------------------------
  # 1. LOCAL NETWORK & PRIVATE IP BYPASS (DIRECT)
  # --------------------------------------------------------------------------
  - DST-PORT,7275,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  - IP-CIDR,255.255.255.255/32,DIRECT,no-resolve

  # Torrents
  - DST-PORT,6881-6889,DIRECT
  - DST-PORT,51413,DIRECT

  # --------------------------------------------------------------------------
  # 2. QUIC PROTOCOL BLOCKING (Prevents UDP Throttling by ISP)
  # --------------------------------------------------------------------------
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT

  # --------------------------------------------------------------------------
  # 3. DOMESTIC SECURITY & PHISHING REJECTION
  # --------------------------------------------------------------------------
  - RULE-SET,iran-all-security,REJECT
  - RULE-SET,iran-all-security-ip,REJECT,no-resolve

  # --------------------------------------------------------------------------
  # 4. DOMESTIC AD-BLOCKING
  # --------------------------------------------------------------------------
  - RULE-SET,iran-all-ads,REJECT

  # --------------------------------------------------------------------------
  # 5. ZERO-DELAY DIRECT DOMAINS (.IR)
  # --------------------------------------------------------------------------
  - DOMAIN-SUFFIX,ir,DIRECT

  # --------------------------------------------------------------------------
  # 6. IRAN MODULAR DIRECT ROUTING (Full Coverage)
  # --------------------------------------------------------------------------
  - RULE-SET,iran-all-apps,DIRECT,no-resolve
  - RULE-SET,iran-modular-banking,DIRECT
  - RULE-SET,iran-modular-gov,DIRECT
  - RULE-SET,iran-modular-media,DIRECT
  - RULE-SET,iran-modular-gaming,DIRECT
  - RULE-SET,iran-modular-download,DIRECT
  - RULE-SET,iran-modular-other,DIRECT
  - RULE-SET,iran-modular-cloud,DIRECT,no-resolve
  - RULE-SET,iran-modular-isp,DIRECT,no-resolve
  - RULE-SET,iran-asn,DIRECT,no-resolve

  # --------------------------------------------------------------------------
  # 7. FINAL FALLBACK CATCH-ALL
  # --------------------------------------------------------------------------
  - MATCH,PROXY
