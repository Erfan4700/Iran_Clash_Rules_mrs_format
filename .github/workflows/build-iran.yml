name: Universal Iran Ruleset Suite Builder

on:
  schedule:
    - cron: '0 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Golang Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install Python Dependencies
        run: |
          pip install --no-cache-dir tldextract

      - name: Install & Setup Mihomo Core
        run: |
          echo "Fetching latest official Mihomo release binary..."
          MIHOMO_URL=$(curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | \
            jq -r '.assets[] | select(.name | test("^mihomo-linux-amd64-(compatible-)?v.*\\.gz$")) | .browser_download_url' | head -n 1)

          if [ -z "$MIHOMO_URL" ] || [ "$MIHOMO_URL" = "null" ]; then
            MIHOMO_URL=$(curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | \
              jq -r '.assets[] | select(.name | test("mihomo-linux-amd64.*\\.gz$")) | .browser_download_url' | head -n 1)
          fi

          curl -sSL "$MIHOMO_URL" -o mihomo.gz
          gzip -d -f mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/
          mihomo -v

      - name: Install & Setup Sing-box Core
        run: |
          echo "Fetching latest official Sing-box release binary..."
          SINGBOX_URL=$(curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/SagerNet/sing-box/releases/latest | \
            jq -r '.assets[] | select(.name | test("sing-box-.*-linux-amd64\\.tar\\.gz$")) | .browser_download_url' | head -n 1)

          curl -sSL "$SINGBOX_URL" -o sing-box.tar.gz
          tar -xzf sing-box.tar.gz
          mv sing-box-*/sing-box ./sing-box
          chmod +x sing-box
          sudo mv sing-box /usr/local/bin/
          sing-box version

      - name: Run Modular Optimization Engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python build.py

      - name: Compile V2Ray / Xray Official Protobuf Binary DATs
        run: |
          echo "=== 1. Compiling geosite.dat & iran.dat ==="
          git clone --depth=1 https://github.com/v2fly/domain-list-community.git dlc-builder
          cd dlc-builder
          go run ./ --datapath=../output_text/v2ray_geosite --outputname=geosite.dat --outputdir=../output_mrs/
          cd ..
          cp output_mrs/geosite.dat output_mrs/iran.dat

          echo "=== 2. Compiling geoip.dat ==="
          git clone --depth=1 https://github.com/v2fly/geoip.git geoip-builder
          cd geoip-builder
          go run ./ -c ../output_text/v2ray_geoip_config.json
          cd ..

          echo "=== 3. Cleaning Temporary Builder Cache ==="
          rm -rf dlc-builder geoip-builder output_mrs/v2ray_geoip_config.json output_mrs/.tld_cache

      - name: Commit & Push Updated Baseline (Layer 2 Resilience)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/baseline/
          if git status --porcelain | grep -q 'data/baseline'; then
            echo "[+] Baseline cache updated. Pushing golden snapshots to main..."
            git commit -m "chore(baseline): update golden snapshots [skip ci]"
            git push origin main
          else
            echo "[-] Baseline is up-to-date. Skipping commit."
          fi

      - name: Verify Generated Artifacts
        run: |
          echo "=== Universal Suite Artifacts ==="
          ls -lh output_mrs/

      - name: Deploy All Artifacts to Release Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: release
          publish_dir: ./output_mrs
          destination_dir: ./
          keep_files: false
          force_orphan: true

      - name: Update Official Rolling Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="latest"
          NOW=$(date -u +'%Y-%m-%d %H:%M UTC')
          RELEASE_TITLE="Universal Iran Ruleset Suite (Updated: $NOW)"
          RELEASE_NOTES="Automated build featuring Modular & Universal RuleSets: V2Ray/Xray (.dat), Mihomo (.mrs), Sing-box (.srs / .json), Shadowrocket/Surge (.list), and Granular Categories (Media, Banking, Gov, Gaming, Download). Last synced: $NOW"

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "[-] Deleting old rolling release metadata..."
            gh release delete "$RELEASE_TAG" --yes --cleanup-tag
          fi

          git tag -d "$RELEASE_TAG" 2>/dev/null || true
          git push origin :refs/tags/"$RELEASE_TAG" 2>/dev/null || true

          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

          echo "[+] Creating clean rolling release..."
          gh release create "$RELEASE_TAG" output_mrs/* \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Purge jsDelivr CDN Cache
        run: |
          echo "Waiting 20 seconds for GitHub RAW storage propagation..."
          sleep 20

          TARGET_FILES=(
            "geosite.dat" "geoip.dat" "iran.dat"
            "iran-domains.mrs" "iran-domains.srs" "iran-domains.txt" "iran-domains.json" "iran-domains.list"
            "iran-domains-lite.mrs" "iran-domains-lite.srs" "iran-domains-lite.txt" "iran-domains-lite.json"
            "iran-ip.mrs" "iran-ip.srs" "iran-ip.txt" "iran-ip.json" "iran-ip.list"
            "iran-cloud.mrs" "iran-cloud.srs" "iran-cloud.txt" "iran-cloud.json" "iran-cloud.list"
            "iran-ads.mrs" "iran-ads.srs" "iran-ads.txt" "iran-ads.json" "iran-ads.list"
            "iran-security.mrs" "iran-security.srs" "iran-security.txt" "iran-security.json" "iran-security.list"
            "iran-security-ip.mrs" "iran-security-ip.srs" "iran-security-ip.txt" "iran-security-ip.json"
            "iran-gambling.mrs" "iran-gambling.srs" "iran-gambling.txt" "iran-gambling.json" "iran-gambling.list"
            "iran-apps.srs" "iran-apps.txt" "iran-apps.yaml" "iran-apps.json"
            "iran-media.mrs" "iran-media.srs" "iran-media.txt" "iran-media.json" "iran-media.list"
            "iran-banking.mrs" "iran-banking.srs" "iran-banking.txt" "iran-banking.json" "iran-banking.list"
            "iran-gov.mrs" "iran-gov.srs" "iran-gov.txt" "iran-gov.json" "iran-gov.list"
            "iran-gaming.mrs" "iran-gaming.srs" "iran-gaming.txt" "iran-gaming.json" "iran-gaming.list"
            "iran-download.mrs" "iran-download.srs" "iran-download.txt" "iran-download.json" "iran-download.list"
            "iran-unified.txt" "iran-unified.yaml" "iran-unified.list"
          )

          for FILE in "${TARGET_FILES[@]}"; do
            echo -n "Purging jsDelivr for $FILE: "
            RESPONSE=$(curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/${FILE}")
            STATUS=$(echo "$RESPONSE" | jq -r .status 2>/dev/null || echo "ok")
            echo "$STATUS"
          done
