name: Universal Iran Ruleset Suite Builder

on:
  schedule:
    - cron: '0 3,15 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data/baseline/custom-domains.txt'
      - 'build.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Golang Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install Python Dependencies
        run: |
          pip install --no-cache-dir tldextract

      - name: Install & Setup Mihomo and Sing-box Cores in Parallel
        run: |
          echo "Fetching and setting up Mihomo and Sing-box in parallel..."

          (
            MIHOMO_URL=$(curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | \
              jq -r '.assets[] | select(.name | test("^mihomo-linux-amd64-(compatible-)?v.*\\.gz$")) | .browser_download_url' | head -n 1)

            if [ -z "$MIHOMO_URL" ] || [ "$MIHOMO_URL" = "null" ]; then
              MIHOMO_URL=$(curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | \
                jq -r '.assets[] | select(.name | test("mihomo-linux-amd64.*\\.gz$")) | .browser_download_url' | head -n 1)
            fi

            curl -sSL "$MIHOMO_URL" -o mihomo.gz
            gzip -d -f mihomo.gz
            chmod +x mihomo
            sudo mv mihomo /usr/local/bin/
          ) &

          (
            SINGBOX_URL=$(curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              https://api.github.com/repos/SagerNet/sing-box/releases/latest | \
              jq -r '.assets[] | select(.name | test("sing-box-.*-linux-amd64\\.tar\\.gz$")) | .browser_download_url' | head -n 1)

            curl -sSL "$SINGBOX_URL" -o sing-box.tar.gz
            tar -xzf sing-box.tar.gz
            mv sing-box-*/sing-box ./sing-box
            chmod +x sing-box
            sudo mv sing-box /usr/local/bin/
          ) &

          wait

          mihomo -v
          sing-box version

      - name: Run Clean Hybrid Engine (Macro & Modular)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python build.py

      - name: Compile V2Ray / Xray Official Protobuf Binary DATs in Parallel
        run: |
          echo "=== Compiling geosite.dat and geoip.dat in parallel ==="

          (
            git clone --depth=1 https://github.com/v2fly/domain-list-community.git dlc-builder
            cd dlc-builder
            go run ./ --datapath=../output_text/v2ray_geosite --outputname=geosite.dat --outputdir=../output_mrs/
            cd ..
            cp output_mrs/geosite.dat output_mrs/iran.dat
          ) &

          (
            git clone --depth=1 https://github.com/v2fly/geoip.git geoip-builder
            cd geoip-builder
            go run ./ -c ../output_text/v2ray_geoip_config.json
            cd ..
          ) &

          wait

          echo "=== Cleaning Temporary Builder Cache ==="
          rm -rf dlc-builder geoip-builder output_mrs/v2ray_geoip_config.json output_mrs/.tld_cache

      - name: Commit & Push Updated Baseline (Layer 2 Resilience)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/baseline/
          if git status --porcelain | grep -q 'data/baseline'; then
            echo "[+] Baseline cache updated. Pushing golden snapshots to main..."
            git commit -m "chore(baseline): update golden snapshots [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          else
            echo "[-] Baseline is up-to-date. Skipping commit."
          fi

      - name: Verify Clean Suite Artifacts
        run: |
          echo "=== Universal Clean Suite Artifacts Summary ==="
          ls -lh output_mrs/

      - name: Deploy Clean Artifacts to Release Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: release
          publish_dir: ./output_mrs
          destination_dir: ./
          keep_files: false
          force_orphan: true

      - name: Update Official Rolling Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="latest"
          NOW=$(date -u +'%Y-%m-%d %H:%M UTC')
          RELEASE_TITLE="Universal Iran Ruleset Suite (Updated: $NOW)"
          RELEASE_NOTES="Automated Clean Build (Zero Duplicates / Zero Loss):
          ★ Macro All-In-One: iran-all-domains, iran-all-ip, iran-all-ads, iran-all-security, iran-all-apps
          ★ Dynamic Exceptions: iran-app-exceptions (Snapp, Tapsi, Metrix & Analytics bypass)
          ★ Modular Disjoint: iran-modular-banking, iran-modular-gov, iran-modular-media, iran-modular-gaming, iran-modular-download, iran-modular-isp, iran-modular-cloud, iran-modular-gambling, iran-modular-other
          ★ Standard Formats: Mihomo (.mrs), Sing-box (.srs / .json), V2Ray/Xray (.dat), Surge (.list), Classical (.yaml / .txt)
          Last synced: $NOW"

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "[-] Deleting old rolling release metadata..."
            gh release delete "$RELEASE_TAG" --yes --cleanup-tag
          fi

          git tag -d "$RELEASE_TAG" 2>/dev/null || true
          git push origin :refs/tags/"$RELEASE_TAG" 2>/dev/null || true

          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

          echo "[+] Creating clean rolling release..."
          gh release create "$RELEASE_TAG" output_mrs/* \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Purge jsDelivr CDN Cache (Dynamic All-Clean-Files)
        run: |
          echo "Waiting 25 seconds for GitHub RAW storage & Release branch propagation..."
          sleep 25

          echo "=== Dynamically Purging ALL Generated Artifacts from jsDelivr in Parallel ==="
          PARALLEL_JOBS=$(nproc || echo 4)
          echo "Running with $PARALLEL_JOBS parallel purge workers..."

          for FILE_PATH in output_mrs/*; do
            if [ -f "$FILE_PATH" ]; then
              (
                FILE_NAME=$(basename "$FILE_PATH")
                RESPONSE=$(curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/${FILE_NAME}")
                STATUS=$(echo "$RESPONSE" | jq -r .status 2>/dev/null || echo "ok")
                echo "Purged $FILE_NAME: $STATUS"
              ) &

              while [ $(jobs -r -p | wc -l) -ge $PARALLEL_JOBS ]; do
                sleep 0.1
              done
            fi
          done

          wait
