name: Iran Rules to MRS Automated Builder

on:
  schedule:
    - cron: '0 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install & Setup Mihomo Core
        run: |
          echo "Fetching latest official Mihomo release binary..."
          MIHOMO_URL=$(curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | \
            jq -r '.assets[] | select(.name | test("^mihomo-linux-amd64-(compatible-)?v.*\\.gz$")) | .browser_download_url' | head -n 1)

          if [ -z "$MIHOMO_URL" ] || [ "$MIHOMO_URL" = "null" ]; then
            MIHOMO_URL=$(curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | \
              jq -r '.assets[] | select(.name | test("mihomo-linux-amd64.*\\.gz$")) | .browser_download_url' | head -n 1)
          fi

          curl -sSL "$MIHOMO_URL" -o mihomo.gz
          gzip -d -f mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/
          mihomo -v

      - name: Run Pure Rule-Set Engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python build.py

      - name: Commit & Push Updated Baseline (Layer 2 Resilience)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/baseline/
          if git status --porcelain | grep -q 'data/baseline'; then
            echo "[+] Baseline cache updated. Pushing golden snapshots to main..."
            git commit -m "chore(baseline): update golden snapshots [skip ci]"
            git push origin main
          else
            echo "[-] Baseline is up-to-date. Skipping commit."
          fi

      - name: Verify Generated Artifacts
        run: |
          echo "=== Exactly 20 Pure Modern Rule-Set Artifacts ==="
          ls -lh output_mrs/

      - name: Deploy All Artifacts to Release Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: release
          publish_dir: ./output_mrs
          destination_dir: ./
          keep_files: false
          force_orphan: true

      - name: Update Official Rolling Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="latest"
          NOW=$(date -u +'%Y-%m-%d %H:%M UTC')
          RELEASE_TITLE="Iran Ruleset Engine (Updated: $NOW)"
          RELEASE_NOTES="Automated binary MRS build featuring 20 Pure Modern RuleSets: Unified Security, Aggregated Cloud CIDRs, RIPE Collapsing, and Android/Windows App Crawlers. Last synced: $NOW"

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "[-] Deleting old rolling release metadata..."
            gh release delete "$RELEASE_TAG" --yes --cleanup-tag
          fi

          git tag -d "$RELEASE_TAG" 2>/dev/null || true
          git push origin :refs/tags/"$RELEASE_TAG" 2>/dev/null || true

          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

          echo "[+] Creating clean rolling release..."
          gh release create "$RELEASE_TAG" output_mrs/* \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Purge jsDelivr CDN Cache (Modern Suite Only)
        run: |
          echo "Waiting 20 seconds for GitHub RAW storage propagation..."
          sleep 20

          TARGET_FILES=(
            "iran-domains.mrs" "iran-domains.txt"
            "iran-domains-lite.mrs" "iran-domains-lite.txt"
            "iran-ip.mrs" "iran-ip.txt"
            "iran-cloud.mrs" "iran-cloud.txt"
            "iran-ads.mrs" "iran-ads.txt"
            "iran-security.mrs" "iran-security.txt"
            "iran-security-ip.mrs" "iran-security-ip.txt"
            "iran-gambling.mrs" "iran-gambling.txt"
            "iran-apps.txt" "iran-apps.yaml"
            "iran-asn.txt" "iran-asn.yaml"
            "iran-unified.txt" "iran-unified.yaml"
          )

          for FILE in "${TARGET_FILES[@]}"; do
            echo -n "Purging jsDelivr for $FILE: "
            RESPONSE=$(curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/${FILE}")
            STATUS=$(echo "$RESPONSE" | jq -r .status 2>/dev/null || echo "ok")
            echo "$STATUS"
          done
