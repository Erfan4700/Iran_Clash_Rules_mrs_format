name: Iran Rules to MRS Automated Builder

on:
  schedule:
    # Runs twice a day (03:00 and 15:00 UTC)
    - cron: '0 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Core Optimization Engine & Crawler
        run: python build.py

      - name: Download Latest Mihomo Core
        run: |
          echo "Fetching latest Mihomo release asset URL..."
          MIHOMO_URL=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | \
            jq -r '.assets[] | select(.name | test("^mihomo-linux-amd64-compatible-.*\\.gz$")) | .browser_download_url' | head -n 1)

          if [ -z "$MIHOMO_URL" ] || [ "$MIHOMO_URL" = "null" ]; then
            echo "[X] ERROR: Failed to obtain Mihomo download URL."
            exit 1
          fi

          echo "Downloading from: $MIHOMO_URL"
          curl -sL "$MIHOMO_URL" -o mihomo.gz
          gzip -d mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: Compile Text Lists to Binary MRS
        run: |
          mkdir -p output_mrs

          echo "=== Verifying Generated Text Files ==="
          ls -lh output_text/

          echo "=== Converting ir.txt ==="
          ./mihomo convert-ruleset domain text output_text/ir.txt output_mrs/ir.mrs

          echo "=== Converting ads.txt ==="
          ./mihomo convert-ruleset domain text output_text/ads.txt output_mrs/ads.mrs

          echo "=== Converting phishing.txt ==="
          ./mihomo convert-ruleset domain text output_text/phishing.txt output_mrs/phishing.mrs

          echo "=== Converting nsfw.txt ==="
          ./mihomo convert-ruleset domain text output_text/nsfw.txt output_mrs/nsfw.mrs

          echo "=== Converting ircidr.txt ==="
          ./mihomo convert-ruleset ipcidr text output_text/ircidr.txt output_mrs/ircidr.mrs

          # Copy Classical text lists (ASN and Android Package Names)
          cp output_text/irasn.txt output_mrs/irasn.txt
          cp output_text/apps.txt output_mrs/apps.txt

          echo "=== All MRS and Classical Artifacts Successfully Generated ==="
          ls -lh output_mrs/

      - name: Deploy MRS Artifacts to Release Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: release
          publish_dir: ./output_mrs
          destination_dir: ./
          keep_files: false

      - name: Update Official Rolling Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="latest"
          NOW=$(date -u +'%Y-%m-%d %H:%M UTC')
          RELEASE_TITLE="Iran Ruleset Engine (Updated: $NOW)"
          RELEASE_NOTES="Automated binary MRS build featuring RIPE CIDR aggregation, Zero-Trust Shaparak whitelist, domestic betting/gambling blocklist, and thousands of crawled Android/Windows packages. Last synced: $NOW"

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Updating existing release..."
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes "$RELEASE_NOTES"
            gh release upload "$RELEASE_TAG" output_mrs/* --clobber
          else
            echo "Creating new rolling release..."
            gh release create "$RELEASE_TAG" output_mrs/* \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" \
              --target main \
              --latest
          fi

      - name: Purge jsDelivr CDN Cache
        run: |
          echo "Waiting 25 seconds for GitHub RAW storage propagation..."
          sleep 25
          for FILE in ir.mrs ads.mrs phishing.mrs nsfw.mrs ircidr.mrs irasn.txt apps.txt; do
            echo "Purging CDN cache for $FILE..."
            STATUS=$(curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/${FILE}" | jq -r .status)
            echo "Purge status for $FILE: $STATUS"
          done
